<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="Sơ đồ minh họa cách thử sản phẩm mới: vùng da bằng khoảng một đồng xu lớn, 2 lần mỗi ngày trong 7 đến 10 ngày">
<rect width="800" height="220" fill="#f7f5f0"/>
<text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">Thử sản phẩm mới an toàn (hình minh họa)</text>
<rect x="40" y="60" width="200" height="100" rx="10" fill="#dbeafe"/><text x="140" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">Vùng thử nhỏ</text><text x="140" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Bằng khoảng 1 đồng xu lớn</text><text x="140" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Mặt trong cánh tay</text>
<text x="255" y="115" font-family="sans-serif" font-size="28" fill="#666">→</text>
<rect x="300" y="60" width="200" height="100" rx="10" fill="#dcfce7"/><text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#14532d">2 lần/ngày</text><text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Trong 7–10 ngày</text><text x="400" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Lượng như dùng thật</text>
<text x="515" y="115" font-family="sans-serif" font-size="28" fill="#666">→</text>
<rect x="560" y="60" width="200" height="100" rx="10" fill="#fef3c7"/><text x="660" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f">Nếu phản ứng</text><text x="660" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Rửa sạch và dừng dùng</text><text x="660" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Nặng thì gặp bác sĩ</text>
<text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Nguồn: AAD — How to Test Skin Care Products Before Use (2021)</text>
</svg>
