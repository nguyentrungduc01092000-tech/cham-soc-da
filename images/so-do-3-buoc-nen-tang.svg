<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="Sơ đồ minh họa 3 bước nền tảng: rửa dịu nhẹ, dưỡng ẩm, chống nắng">
<rect width="800" height="220" fill="#f7f5f0"/>
<text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">3 bước nền tảng mỗi ngày (hình minh họa)</text>
<rect x="40" y="60" width="200" height="100" rx="10" fill="#dbeafe"/><text x="140" y="105" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e3a5f">1. Rửa dịu nhẹ</text><text x="140" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Tối đa 2 lần/ngày</text>
<text x="255" y="115" font-family="sans-serif" font-size="28" fill="#666">→</text>
<rect x="300" y="60" width="200" height="100" rx="10" fill="#dcfce7"/><text x="400" y="105" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#14532d">2. Dưỡng ẩm</text><text x="400" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Khi da còn hơi ẩm</text>
<text x="515" y="115" font-family="sans-serif" font-size="28" fill="#666">→</text>
<rect x="560" y="60" width="200" height="100" rx="10" fill="#fef3c7"/><text x="660" y="105" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#78350f">3. Chống nắng</text><text x="660" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Phổ rộng, SPF 30+</text>
<text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Nguồn: AAD — How to Care for Your Skin Without Breaking the Bank (2020)</text>
</svg>
